<div class="uiCreateCharacter">
	<img class="logo" src="images/logo_CWB.png" alt="">
	<div class="box-left hasBorderShadow">
		<div class="left">
			<div class="label">nom</div>
			<input type="text" class="el textbox txtName" maxlength="12">
			<div class="label">classe</div>
			<div class="el textbox txtClass"></div>
			<div class="label">skin</div>
			<div class="skinBox">
				<div class="btn btnPrev" delta="-1">&lt;</div>
				<div class="el textbox txtCostume"></div>
				<div class="btn btnNext" delta="1">&gt;</div>
			</div>
			<div class="message"></div>
		</div>
		<div class="right">
			<div class="portrait">
				<div class="sprite"></div>
			</div>
			<div class="el btn btnBack">Retour</div>
			<div class="el btn btnCreate">Créer</div>
		</div>
	</div>
	<div class="box-right hasBorderShadow">
		<div class="top">
			<div class="heading">Options</div>
			<div class="list">
				<div prophecy="austere" tooltip="vous êtes simple et ne peu utilisé que des items de bases ou magique" class="prophecy">austere</div>
				<div prophecy="butcher" tooltip="Active le PVP" class="prophecy">butcher</div>
				<div prophecy="crushable" tooltip="you will take quadruple damage from all sources" class="prophecy">crushable</div>
				<div prophecy="hardcore" tooltip="your death will be permanent" class="prophecy">hardcore</div>
			</div>
		</div>
	</div>
</div>
